[project]
name = "tracks"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165",
    "uvicorn>=0.54",
    "sqlalchemy>=2.1",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.16",
    "alembic>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=9", "httpx>=0.28", "ruff>=0.17"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]  # fichiers générés
